<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fuja com o Mouse</title>
  <style>
    :root {
      --bg: #060814;
      --bg-2: #0b1022;
      --panel: rgba(12, 17, 34, 0.72);
      --panel-border: rgba(255, 255, 255, 0.12);
      --text: #e8eefc;
      --muted: #9aa8c7;
      --accent: #66e3ff;
      --danger: #ff5f6d;
      --warning: #ffb547;
      --good: #47e6a3;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(102, 227, 255, 0.18), transparent 32%),
        radial-gradient(circle at 80% 10%, rgba(255, 95, 109, 0.16), transparent 26%),
        radial-gradient(circle at 50% 90%, rgba(71, 230, 163, 0.12), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      user-select: none;
      touch-action: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
      opacity: 0.32;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }

    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
    }

    .hud-card {
      min-width: 140px;
      padding: 12px 14px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: var(--panel);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .hud-label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .hud-value {
      font-size: 30px;
      font-weight: 800;
      line-height: 1;
      color: var(--text);
    }

    .hud-sub {
      margin-top: 4px;
      font-size: 13px;
      color: var(--muted);
    }

    #overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      background:
        radial-gradient(circle at center, rgba(13, 17, 36, 0.38), rgba(6, 8, 20, 0.92)),
        linear-gradient(180deg, rgba(6, 8, 20, 0.2), rgba(6, 8, 20, 0.86));
      padding: 24px;
      overflow-y: auto;
    }

    .panel {
      width: min(600px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 28px;
      background: rgba(9, 13, 28, 0.72);
      backdrop-filter: blur(24px);
      box-shadow: 0 30px 120px rgba(0, 0, 0, 0.55);
      padding: 40px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
      margin: auto;
    }

    .panel::before {
      content: "";
      position: absolute;
      inset: -80px;
      background:
        radial-gradient(circle at 18% 25%, rgba(102, 227, 255, 0.16), transparent 22%),
        radial-gradient(circle at 82% 12%, rgba(255, 95, 109, 0.18), transparent 18%),
        radial-gradient(circle at 50% 100%, rgba(71, 230, 163, 0.12), transparent 24%);
      pointer-events: none;
    }

    .eyebrow {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.04);
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      margin: 0;
      font-size: clamp(42px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    h1 .danger {
      color: var(--danger);
    }

    p.main-desc {
      position: relative;
      max-width: 58ch;
      margin: 18px auto 0;
      font-size: 18px;
      line-height: 1.6;
      color: var(--muted);
    }

    .actions {
      position: relative;
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 26px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 14px 22px;
      font: inherit;
      font-weight: 800;
      font-size: 16px;
      color: #08111c;
      background: linear-gradient(135deg, var(--accent), #9cf7ff);
      cursor: pointer;
      box-shadow: 0 18px 40px rgba(102, 227, 255, 0.28);
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.05);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .ghost {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: none;
    }

    #footerHint {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
      position: relative;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      padding: 12px 16px;
      border-radius: 999px;
      background: rgba(7, 10, 18, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 12;
      backdrop-filter: blur(10px);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px);
    }

    @media (max-width: 720px) {
      #hud { top: 12px; left: 12px; right: 12px; }
      .hud-card { min-width: 0; flex: 1; }
      .hud-value { font-size: 24px; }
      .panel { padding: 30px 22px; border-radius: 22px; }
      p.main-desc { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="hud" aria-hidden="true">
    <div class="hud-card">
      <span class="hud-label">Tempo</span>
      <div class="hud-value"><span id="timeDisplay">0.0</span>s</div>
      <div class="hud-sub">Sobreviva o máximo possível</div>
    </div>
    <div class="hud-card" style="text-align:right;">
      <span class="hud-label">Melhor marca</span>
      <div class="hud-value"><span id="bestDisplay">0.0</span>s</div>
      <div class="hud-sub">Registrado no navegador</div>
    </div>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div id="overlay">
    <div class="panel">
      <div class="eyebrow">Mouse Avoider</div>
      <h1 id="overlayTitle">Fuja do <span class="danger">GlitchBot</span></h1>
      <p id="overlayDesc" class="main-desc">Escape com o mouse se for capaz.</p>

      <div id="authSection" style="position: relative; margin-top: 28px; z-index: 2;">
        
        <div id="nameInputUI" style="display: block;">
          <div style="display: flex; gap: 8px; justify-content: center; align-items: center;">
            <input type="text" id="playerNameInput" placeholder="Seu Nickname" maxlength="15" 
                   style="padding: 14px 18px; border-radius: 16px; border: 1px solid var(--panel-border); background: rgba(0,0,0,0.4); color: var(--text); outline: none; font: inherit; flex-grow: 1; max-width: 200px;">
            <button id="registerNameBtn" style="padding: 14px 24px; font-size: 14px;">Salvar e Jogar</button>
          </div>
        </div>

        <div id="autoSaveUI" style="display: none; background: rgba(255,255,255,0.03); border: 1px solid var(--panel-border); border-radius: 16px; padding: 14px; margin: 0 auto 16px auto; max-width: 300px;">
          <p style="margin: 0; font-size: 16px; color: var(--text);">
            Jogador: <strong id="displayName" style="color: var(--accent);"></strong>
          </p>
        </div>

        <div id="submitMsg" style="font-size: 14px; margin-bottom: 16px; font-weight: 600; min-height: 20px;"></div>
      </div>

      <div class="actions" id="actionButtons" style="display: none;">
        <button id="startBtn">Iniciar fuga</button>
        <button id="demoBtn" class="ghost">Ver dicas rápidas</button>
      </div>

      <div id="leaderboardSection" style="position: relative; margin-top: 28px; text-align: left; background: rgba(0,0,0,0.25); border: 1px solid var(--panel-border); padding: 20px; border-radius: 20px; z-index: 2;">
        <h3 style="margin: 0 0 16px 0; font-size: 13px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; display: flex; justify-content: space-between;">
          <span>Top 5 Global</span>
          <span style="color: var(--muted); cursor: pointer; font-size: 11px;" onclick="fetchLeaderboard(true)">↻ Atualizar</span>
        </h3>
        <ol id="leaderboardList" style="margin: 0; padding-left: 20px; color: var(--text); font-size: 15px; line-height: 1.8;">
          <li style="color: var(--muted);">Carregando placar...</li>
        </ol>
      </div>

      <div id="footerHint">Dica: em tela touch, arraste o dedo para controlar o cursor invisível.</div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');
    const demoBtn = document.getElementById('demoBtn');
    const timeDisplay = document.getElementById('timeDisplay');
    const bestDisplay = document.getElementById('bestDisplay');
    const toast = document.getElementById('toast');

    const playerNameInput = document.getElementById('playerNameInput');
    const registerNameBtn = document.getElementById('registerNameBtn');
    const nameInputUI = document.getElementById('nameInputUI');
    const autoSaveUI = document.getElementById('autoSaveUI');
    const displayName = document.getElementById('displayName');
    const submitMsg = document.getElementById('submitMsg');
    const leaderboardList = document.getElementById('leaderboardList');
    const actionButtons = document.getElementById('actionButtons');
    
    const playerTokenKey = 'mouse-avoid-player-token';
    const savedPlayerNameKey = 'mouse-avoid-player-name';
    const syncedScoreKey = 'mouse-avoid-synced-time';
    const leaderboardCacheKey = 'mouse-avoid-leaderboard-cache'; 
    const bestScoreKey = 'mouse-avoid-best-time';
    const leaderboardEndpoint = '/api/leaderboard';
    const leaderboardApiAvailable = location.protocol !== 'file:';

    let bestTime = Number(localStorage.getItem(bestScoreKey) || 0);
    let syncedTime = Number(localStorage.getItem(syncedScoreKey) || 0); 
    bestDisplay.textContent = bestTime.toFixed(1);

    const state = {
      running: false,
      ended: false,
      lastTs: 0,
      startTs: 0,
      time: 0,
      dpr: Math.max(1, Math.min(2, window.devicePixelRatio || 1)),
      shake: 0,
      flash: 0,
      pointerInside: true
    };

    const world = { width: 0, height: 0, stars: [] };

    const mouse = {
      x: 0, y: 0, vx: 0, vy: 0, lastX: 0, lastY: 0, lastMoveTs: 0,
      radius: 4,
      visible: true
    };

    let bot;
    let projectiles = [];
    let particles = [];
    let enemies = [];
    let bossClones = [];
    let blackHoles = [];    
    let slowZones = [];     
    let kamehamehas = [];   
    let spawnTimer = 0;
    let botAttackTimer = 0;
    let botState = 'CHASE';
    let botStateTimer = 0;
    let dashVector = { x: 0, y: 0 };
    let teleportTarget = null;
    let titleFlashTimer = 0;

    function rand(min, max) { return Math.random() * (max - min) + min; }
    function clamp(value, min, max) { return Math.max(min, Math.min(max, value)); }

    function resizeCanvas() {
      state.dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = Math.floor(width * state.dpr);
      canvas.height = Math.floor(height * state.dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      world.width = width;
      world.height = height;

      if (mouse.x === 0 && mouse.y === 0) {
        mouse.x = width / 2;
        mouse.y = height / 2;
      }

      world.stars = Array.from({ length: Math.max(70, Math.floor((width * height) / 18000)) }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: rand(0.8, 2.2),
        s: rand(0.08, 0.4),
        hue: rand(180, 220)
      }));
    }

    function resetGame() {
      bot = { x: 120, y: 120, radius: 18, baseSpeed: 170, color: '#ff5f6d', eyeAngle: 0, attackDelay: 2.0 };
      projectiles = []; particles = []; enemies = []; bossClones = []; blackHoles = []; slowZones = []; kamehamehas = [];
      spawnTimer = 0; botAttackTimer = 0; botState = 'CHASE'; botStateTimer = 0;
      dashVector = { x: 0, y: 0 }; teleportTarget = null; bot.alpha = 1;
      state.shake = 0; state.flash = 0; titleFlashTimer = 0; state.ended = false;
      mouse.visible = true; mouse.vx = 0; mouse.vy = 0; mouse.lastMoveTs = 0;
      timeDisplay.textContent = '0.0';
      overlay.style.display = 'none';
    }

    function startGame() {
      resetGame();
      state.running = true;
      state.startTs = performance.now();
      state.lastTs = state.startTs;
      requestAnimationFrame(loop);
      showToast('Boa sorte. O robô aprende enquanto você corre.');
    }

    function checkPlayerAuth() {
      const nome = localStorage.getItem(savedPlayerNameKey);
      if (nome) {
        nameInputUI.style.display = 'none';
        autoSaveUI.style.display = 'block';
        actionButtons.style.display = 'flex';
        displayName.textContent = nome;
      } else {
        nameInputUI.style.display = 'block';
        autoSaveUI.style.display = 'none';
        actionButtons.style.display = 'none';
      }
    }

    function endGame(reason = 'Você foi pego') {
      if (state.ended) return;
      state.running = false;
      state.ended = true;
      mouse.visible = true;

      if (state.time > bestTime) {
        bestTime = state.time;
        localStorage.setItem(bestScoreKey, String(bestTime));
        bestDisplay.textContent = bestTime.toFixed(1);
      }

      overlay.style.display = 'flex';
      document.querySelector('#overlayTitle').innerHTML = reason === 'Você foi pego'
        ? 'Você foi <span class="danger">capturado</span>'
        : 'Fim da <span class="danger">fuga</span>';
      
      const overlayP = document.querySelector('#overlayDesc');
      if(overlayP) {
        overlayP.innerHTML = `O GlitchBot venceu depois de <strong>${state.time.toFixed(1)} segundos</strong>.<br>Seu melhor tempo local é <strong>${bestTime.toFixed(1)} segundos</strong>.`;
      }
      
      startBtn.textContent = 'Tentar novamente';
      submitMsg.textContent = ""; 
      
      checkPlayerAuth();
      const nomeSalvo = localStorage.getItem(savedPlayerNameKey);

      if (nomeSalvo && state.time > syncedTime && state.time > 0) {
         autoSaveScore(nomeSalvo, state.time);
      }

      renderLeaderboardFromCache();
      state.flash = 1;
      drawOverlayFrame();
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function spawnParticles(x, y, color, amount = 10, spread = 1.8, speed = 160) {
      for (let i = 0; i < amount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = rand(0, spread);
        particles.push({ x, y, vx: Math.cos(angle) * rand(speed * 0.25, speed) * 0.016, vy: Math.sin(angle) * rand(speed * 0.25, speed) * 0.016, life: rand(0.35, 0.85), maxLife: 1, size: rand(1.5, 3.8) + dist, color });
      }
    }
    function spawnProjectile(x, y, targetX, targetY, speed = 380, color = '#ffb547') {
      const dx = targetX - x; const dy = targetY - y; const distance = Math.hypot(dx, dy) || 1;
      projectiles.push({ x, y, vx: (dx / distance) * speed, vy: (dy / distance) * speed, radius: rand(3.5, 5.5), color, kind: 'straight', turnRate: 0, life: 4 });
    }
    function spawnHomingProjectile(x, y, targetX, targetY, speed = 260, color = '#66e3ff') {
      const dx = targetX - x; const dy = targetY - y; const distance = Math.hypot(dx, dy) || 1;
      projectiles.push({ x, y, vx: (dx / distance) * speed, vy: (dy / distance) * speed, radius: rand(4, 6), color, kind: 'homing', turnRate: rand(2.2, 4.2), life: 5 });
    }
    function spawnBossClone(x, y, phase, duration = 2.4) {
      bossClones.push({ x, y, radius: rand(13, 16), speed: rand(140, 190) + phase * 2.4, hue: phase > 25 ? '#47e6a3' : '#66e3ff', wobble: Math.random() * Math.PI * 2, life: duration, burstTimer: rand(0.12, 0.32), shotDone: false });
    }

    function spawnBlackHole(x, y) {
      blackHoles.push({
        x: x, y: y,
        radius: 0, maxRadius: 50,
        warningTimer: 0.8,         
        active: false,
        life: 2.2,                 
        pullStrength: 120          
      });
      spawnParticles(x, y, '#9a47ff', 12, 1.5, 100);
    }

    function spawnSlowZone(x, y) {
      slowZones.push({
        x: x, y: y,
        width: 160, height: 100,
        life: 2.0                  
      });
      spawnParticles(x, y, '#ffb547', 10, 1.5, 100);
    }

    // KAMEHAMEHA COM AIMBOT JUSTO: Trava a mira prematuramente e dá margem de escape
    function spawnKamehameha() {
      if (projectiles.length > 4) projectiles.splice(0, Math.floor(projectiles.length / 2));
      if (enemies.length > 3) enemies.splice(0, Math.floor(enemies.length / 2));

      kamehamehas.push({
        warningTimer: 1.6, // 1.6s de aviso para o jogador escapar da linha de tiro
        activeTimer: 0.8,  
        angle: 0
      });
      spawnParticles(bot.x, bot.y, '#66e3ff', 30, 3.0, 250);
    }

    function spawnEnemyAt(x, y, type = 'interceptor', forcedSpeed = 0) {
      const isOrbiter = type === 'orbiter'; const isFlanker = type === 'flanker';
      enemies.push({ x, y, life: rand(12, 20), radius: rand(8, 13), speed: forcedSpeed || rand(90, 140) + state.time * (isOrbiter ? 2.2 : 3.4), type, orbitAngle: Math.random() * Math.PI * 2, orbitRadius: rand(52, 120), orbitSpin: rand(0.6, 1.4) * (Math.random() > 0.5 ? 1 : -1), wobble: Math.random() * Math.PI * 2, turnBias: isOrbiter ? 0.62 : isFlanker ? 0.84 : 1, pursueLag: rand(0.12, 0.42), flankSide: Math.random() > 0.5 ? 1 : -1, hue: isOrbiter ? '#66e3ff' : isFlanker ? '#47e6a3' : '#ff5f6d' });
    }
    function spawnEnemy() {
      const side = Math.floor(Math.random() * 4); let x = 0; let y = 0;
      if (side === 0) { x = rand(0, world.width); y = -24; } else if (side === 1) { x = world.width + 24; y = rand(0, world.height); } else if (side === 2) { x = rand(0, world.width); y = world.height + 24; } else { x = -24; y = rand(0, world.height); }
      const enemyTypes = ['interceptor', 'orbiter', 'flanker'];
      if (state.time > 18) enemyTypes.push('hunter');
      if (state.time > 30) enemyTypes.push('orbiter', 'flanker');
      spawnEnemyAt(x, y, enemyTypes[Math.floor(Math.random() * enemyTypes.length)]);
    }
    function pointerToWorld(event) {
      const rect = canvas.getBoundingClientRect();
      let nextX = clamp(event.clientX - rect.left, 0, world.width);
      let nextY = clamp(event.clientY - rect.top, 0, world.height);

      for (const sz of slowZones) {
        if (nextX >= sz.x - sz.width/2 && nextX <= sz.x + sz.width/2 &&
            nextY >= sz.y - sz.height/2 && nextY <= sz.y + sz.height/2) {
          nextX = mouse.x + (nextX - mouse.x) * 0.85;
          nextY = mouse.y + (nextY - mouse.y) * 0.85;
        }
      }

      const now = performance.now();
      const deltaSeconds = mouse.lastMoveTs ? Math.max(0.001, (now - mouse.lastMoveTs) / 1000) : 0;
      mouse.vx = deltaSeconds ? (nextX - mouse.x) / deltaSeconds : 0;
      mouse.vy = deltaSeconds ? (nextY - mouse.y) / deltaSeconds : 0;
      mouse.lastX = mouse.x; mouse.lastY = mouse.y; mouse.x = nextX; mouse.y = nextY; mouse.lastMoveTs = now; mouse.visible = true;
    }
    function getMousePrediction(enemy) {
      const leadTime = clamp(0.18 + state.time * 0.01 + enemy.speed / 1200, 0.18, 0.62);
      return { x: clamp(mouse.x + mouse.vx * leadTime, 0, world.width), y: clamp(mouse.y + mouse.vy * leadTime, 0, world.height) };
    }
    function getBossAimPoint(phase, aggression = 1) {
      const leadTime = clamp(0.10 + phase * 0.005, 0.10, 0.40) * aggression;
      return { x: clamp(mouse.x + mouse.vx * leadTime, 0, world.width), y: clamp(mouse.y + mouse.vy * leadTime, 0, world.height) };
    }
    function getEnemyTarget(enemy) {
      const predicted = getMousePrediction(enemy);
      const dx = predicted.x - mouse.x; const dy = predicted.y - mouse.y;
      const moveLen = Math.hypot(mouse.vx, mouse.vy) || 1;
      const perpX = -(mouse.vy / moveLen); const perpY = (mouse.vx / moveLen);
      if (enemy.type === 'orbiter') {
        enemy.orbitAngle += enemy.orbitSpin * 0.025;
        const radius = enemy.orbitRadius + Math.sin(enemy.orbitAngle * 1.7) * 14;
        return { x: clamp(mouse.x + Math.cos(enemy.orbitAngle) * radius, 0, world.width), y: clamp(mouse.y + Math.sin(enemy.orbitAngle) * radius, 0, world.height) };
      }
      if (enemy.type === 'flanker') return { x: clamp(predicted.x + perpX * enemy.orbitRadius * enemy.flankSide, 0, world.width), y: clamp(predicted.y + perpY * enemy.orbitRadius * enemy.flankSide, 0, world.height) };
      if (enemy.type === 'hunter') return { x: clamp(predicted.x + dx * 0.12, 0, world.width), y: clamp(predicted.y + dy * 0.12, 0, world.height) };
      return predicted;
    }
    function teleportBoss(phase, preferEdge = false) {
      const angle = Math.atan2(mouse.y - bot.y, mouse.x - bot.x);
      const offsetAngle = angle + Math.PI + rand(-0.85, 0.85);
      const dist = preferEdge ? rand(190, 260) : rand(120, 210);
      const nextX = clamp(mouse.x + Math.cos(offsetAngle) * dist, 30, world.width - 30);
      const nextY = clamp(mouse.y + Math.sin(offsetAngle) * dist, 30, world.height - 30);
      bot.x = nextX; bot.y = nextY; bot.alpha = 0; teleportTarget = { x: nextX, y: nextY, phase, fadeIn: 0 };
      spawnParticles(nextX, nextY, '#66e3ff', 22, 2.2, 240);
      spawnBossRingShot(nextX, nextY, 8 + Math.min(6, Math.floor(phase / 10)), 280 + phase * 4, '#66e3ff');
    }
    function spawnBossRingShot(x, y, count, speed, color) {
      const offset = Math.random() * Math.PI * 2;
      for (let i = 0; i < count; i++) {
        const angle = offset + (Math.PI * 2 * i) / count;
        projectiles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: rand(3.2, 5.2), color });
      }
    }
    function spawnBossFan(x, y, targetX, targetY, spreadCount, speed, color) {
      const angle = Math.atan2(targetY - y, targetX - x);
      for (let i = 0; i < spreadCount; i++) {
        const offset = (i - (spreadCount - 1) / 2) * 0.18;
        projectiles.push({ x, y, vx: Math.cos(angle + offset) * speed, vy: Math.sin(angle + offset) * speed, radius: rand(3.4, 5.4), color });
      }
    }
    function spawnBossSweep(originX, originY, baseAngle, spread, count, speed, color) {
      for (let i = 0; i < count; i++) {
        const angle = baseAngle - spread / 2 + spread * (count === 1 ? 0.5 : i / (count - 1));
        projectiles.push({ x: originX, y: originY, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, radius: rand(3, 5), color });
      }
    }

    function chooseBossPattern() {
      const options = ['DASH', 'SHOOT', 'TELEPORT', 'HOMING', 'PURSUE', 'CLONE', 'SWEEP', 'SUMMON', 'RING', 'BERSERK', 'BLACKHOLE', 'SLOWZONE', 'KAMEHAMEHA'];
      const filtered = options.filter(p => p !== botState);
      return (filtered.length ? filtered : options)[Math.floor(Math.random() * (filtered.length || options.length))];
    }

    function summonMinions(amount) {
      for (let i = 0; i < amount; i++) {
        const angle = (Math.PI * 2 * i) / amount + Math.random() * 0.45;
        const dist = rand(150, 260);
        spawnEnemyAt(clamp(mouse.x + Math.cos(angle) * dist, 24, world.width - 24), clamp(mouse.y + Math.sin(angle) * dist, 24, world.height - 24), i % 3 === 0 ? 'orbiter' : i % 2 === 0 ? 'flanker' : 'hunter', rand(110, 180) + state.time * 2.5);
      }
    }

    function updateBot(dt) {
      const dx = mouse.x - bot.x; const dy = mouse.y - bot.y; const distance = Math.hypot(dx, dy) || 1;
      const dirX = dx / distance; const dirY = dy / distance; const phase = state.time;
      bot.baseSpeed = 150 + phase * 4; bot.eyeAngle = Math.atan2(dy, dx);
      botAttackTimer += dt; botStateTimer += dt;

      if (distance < bot.radius + mouse.radius) { spawnParticles(mouse.x, mouse.y, '#ff5f6d', 28, 2.4, 220); endGame(); return; }

      switch (botState) {
        case 'CHASE':
          const lead = getBossAimPoint(phase, distance < 220 ? 1.2 : 1);
          const chaseLen = Math.hypot(lead.x - bot.x, lead.y - bot.y) || 1;
          const chaseDirX = (lead.x - bot.x) / chaseLen; const chaseDirY = (lead.y - bot.y) / chaseLen;
          const agility = 1 + Math.min(1.2, phase / 25);
          bot.x += chaseDirX * bot.baseSpeed * agility * dt; bot.y += chaseDirY * bot.baseSpeed * agility * dt;
          
          if (distance < 160 && botAttackTimer > 0.7) { 
            botAttackTimer = 0; botStateTimer = 0; 
            botState = chooseBossPattern(); 
            dashVector = { x: chaseDirX, y: chaseDirY }; 
            spawnParticles(bot.x, bot.y, '#ffb547', 14, 2.0, 160); 
            teleportTarget = null; 
            bot.attackDelay = rand(1.2, 2.5); 
          }
          else if (bot.attackDelay && botAttackTimer > bot.attackDelay) { 
            botAttackTimer = 0; botStateTimer = 0; 
            botState = chooseBossPattern(); 
            dashVector = { x: chaseDirX, y: chaseDirY }; 
            spawnParticles(bot.x, bot.y, '#e8eefc', 18, 2.2, 170); 
            teleportTarget = null; 
            bot.attackDelay = rand(1.2, 2.5); 
          }
          break;
        case 'DASH':
          bot.color = botStateTimer < 0.14 ? '#ffffff' : '#ff5f6d';
          bot.x += dashVector.x * (bot.baseSpeed * 3.3) * dt; bot.y += dashVector.y * (bot.baseSpeed * 3.3) * dt;
          if (botStateTimer > 0.48) { bot.color = '#ff5f6d'; botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'PURSUE':
          const aim = getBossAimPoint(phase, 1.6); const pLen = Math.hypot(aim.x - bot.x, aim.y - bot.y) || 1;
          if (botStateTimer < 0.08) bot.color = '#ffb547';
          bot.x += ((aim.x - bot.x) / pLen) * (bot.baseSpeed * 2.2) * dt; bot.y += ((aim.y - bot.y) / pLen) * (bot.baseSpeed * 2.2) * dt;
          
          if (botStateTimer > 0.12 && botStateTimer - dt <= 0.12) {
            spawnParticles(bot.x, bot.y, '#ffb547', 12, 1.5, 120);
            spawnBossFan(bot.x, bot.y, mouse.x, mouse.y, 3, 400 + phase * 2, '#ffb547');
          }
          if (botStateTimer > 0.26) { bot.color = '#ff5f6d'; botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'SHOOT':
          if (botStateTimer > 0.12 && botStateTimer - dt <= 0.12) { bot.color = '#ffb547'; spawnBossFan(bot.x, bot.y, mouse.x, mouse.y, 4, 410, '#ffb547'); }
          if (botStateTimer > 0.33 && botStateTimer - dt <= 0.33) spawnProjectile(bot.x, bot.y, mouse.x, mouse.y, 260 + phase * 1.4, '#66e3ff');
          if (botStateTimer > 0.54 && botStateTimer - dt <= 0.54) { spawnBossFan(bot.x, bot.y, mouse.x, mouse.y, 4, 500, '#ff5f6d'); bot.color = '#ff5f6d'; }
          if (botStateTimer > 0.86) { botState = 'CHASE'; botStateTimer = 0; bot.color = '#ff5f6d'; }
          break;
        case 'TELEPORT':
          if (botStateTimer < 0.42) { bot.radius = Math.max(0, 18 * (1 - botStateTimer / 0.42)); bot.alpha = Math.max(0, 1 - botStateTimer / 0.42); }
          if (botStateTimer >= 0.42 && !teleportTarget) teleportBoss(phase, true);
          if (teleportTarget) { teleportTarget.fadeIn += dt * 1.6; bot.alpha = Math.min(1, teleportTarget.fadeIn); bot.radius = Math.min(18, 18 * bot.alpha); }
          if (botStateTimer > 1.05) { bot.radius = 18; botState = 'CHASE'; botStateTimer = 0; teleportTarget = null; bot.alpha = 1; }
          break;
        case 'HOMING':
          if (botStateTimer < 0.12) bot.color = '#66e3ff';
          if (botStateTimer > 0.08 && botStateTimer - dt <= 0.08) spawnHomingProjectile(bot.x, bot.y, mouse.x, mouse.y, 220 + phase * 2.2, '#66e3ff');
          if (botStateTimer > 0.28 && botStateTimer - dt <= 0.28) spawnProjectile(bot.x, bot.y, mouse.x, mouse.y, 300 + phase * 1.6, '#ff5f6d');
          if (botStateTimer > 0.92) { bot.color = '#ff5f6d'; botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'CLONE':
          if (botStateTimer < 0.12) { bot.color = '#f0f4ff'; bot.alpha = 0.25; }
          if (botStateTimer > 0.14 && botStateTimer - dt <= 0.14 && bossClones.length === 0) {
            const count = 2 + Math.min(2, Math.floor(phase / 16));
            for (let i = 0; i < count; i++) {
              const ang = (Math.PI * 2 * i) / count + Math.random() * 0.35; const dist = rand(120, 220);
              spawnBossClone(clamp(mouse.x + Math.cos(ang) * dist, 28, world.width - 28), clamp(mouse.y + Math.sin(ang) * dist, 28, world.height - 28), phase, 2.2 + i * 0.25);
            }
          }
          if (botStateTimer > 0.28 && botStateTimer - dt <= 0.28) { spawnBossRingShot(bot.x, bot.y, 8, 320 + phase * 3, '#66e3ff'); spawnProjectile(bot.x, bot.y, mouse.x, mouse.y, 280 + phase * 1.8, '#f0f4ff'); }
          if (botStateTimer > 0.78) { bot.color = '#ff5f6d'; bot.alpha = 1; botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'SWEEP':
          const targetY = clamp(mouse.y + (Math.sin(botStateTimer * 5) > 0 ? 1 : -1) * 130, 24, world.height - 24);
          const targetX = clamp(mouse.x + Math.cos(botStateTimer * 3) * 150, 24, world.width - 24);
          bot.x += clamp(targetX - bot.x, -1, 1) * (bot.baseSpeed * 1.7) * dt; bot.y += clamp(targetY - bot.y, -1, 1) * (bot.baseSpeed * 1.7) * dt;
          
          if (Math.floor(botStateTimer * 10) > Math.floor((botStateTimer - dt) * 10) && Math.floor(botStateTimer * 10) % 3 === 0) {
            spawnBossSweep(bot.x, bot.y, Math.atan2(mouse.y - bot.y, mouse.x - bot.x), 1.1, 4, 360 + phase * 3, '#47e6a3');
          }
          if (botStateTimer > 1.1) { botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'SUMMON':
          if (botStateTimer < 0.14) bot.color = '#47e6a3';
          if (botStateTimer > 0.18 && botStateTimer - dt <= 0.18) summonMinions(2 + Math.min(3, Math.floor(phase / 10)));
          if (botStateTimer > 0.32 && botStateTimer - dt <= 0.32) spawnBossFan(bot.x, bot.y, mouse.x, mouse.y, 5, 440, '#47e6a3');
          if (botStateTimer > 0.92) { bot.color = '#ff5f6d'; botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'RING':
          if (botStateTimer < 0.12) bot.color = '#66e3ff';
          if (botStateTimer > 0.18 && botStateTimer - dt <= 0.18) spawnBossRingShot(bot.x, bot.y, 10 + Math.min(6, Math.floor(phase / 8)), 290 + phase * 5, '#66e3ff');
          if (botStateTimer > 0.46 && botStateTimer - dt <= 0.46) spawnBossFan(bot.x, bot.y, mouse.x, mouse.y, 6, 500, '#ffb547');
          if (botStateTimer > 0.82) { bot.color = '#ff5f6d'; botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'BERSERK':
          const pulseSpeed = 1.9 + Math.sin(botStateTimer * 8) * 0.4;
          bot.x += dirX * bot.baseSpeed * pulseSpeed * dt; bot.y += dirY * bot.baseSpeed * pulseSpeed * dt;
          if (botStateTimer > 0.10 && botStateTimer - dt <= 0.10) spawnBossFan(bot.x, bot.y, mouse.x, mouse.y, 5, 520, '#ff5f6d');
          if (botStateTimer > 0.26 && botStateTimer - dt <= 0.26) spawnBossRingShot(bot.x, bot.y, 12, 310 + phase * 4, '#f0f4ff');
          if (botStateTimer > 0.44 && botStateTimer - dt <= 0.44) spawnBossSweep(bot.x, bot.y, Math.atan2(mouse.y - bot.y, mouse.x - bot.x), 1.6, 7, 480, '#ffb547');
          if (botStateTimer > 0.78) { botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'BLACKHOLE':
          if (botStateTimer < 0.12) {
            bot.color = '#9a47ff';
            spawnBlackHole(mouse.x + rand(-60, 60), mouse.y + rand(-60, 60));
          }
          if (botStateTimer > 0.6) { bot.color = '#ff5f6d'; botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'SLOWZONE':
          if (botStateTimer < 0.12) {
            bot.color = '#ffb547';
            spawnSlowZone(rand(100, world.width - 100), rand(100, world.height - 100));
          }
          if (botStateTimer > 0.6) { bot.color = '#ff5f6d'; botState = 'CHASE'; botStateTimer = 0; }
          break;
        case 'KAMEHAMEHA':
          if (botStateTimer < 0.12) {
            bot.color = '#66e3ff';
            spawnKamehameha();
          }
          if (botStateTimer > 2.4) { bot.color = '#ff5f6d'; botState = 'CHASE'; botStateTimer = 0; }
          break;
      }
      bot.x = clamp(bot.x, 18, world.width - 18); bot.y = clamp(bot.y, 18, world.height - 18);
    }

    function updateBlackHoles(dt) {
      for (let i = blackHoles.length - 1; i >= 0; i--) {
        const bh = blackHoles[i];
        if (bh.warningTimer > 0) {
          bh.warningTimer -= dt;
          continue; 
        }

        bh.life -= dt;
        if (bh.radius < bh.maxRadius) bh.radius += dt * 30;

        const dx = bh.x - mouse.x;
        const dy = bh.y - mouse.y;
        const dist = Math.hypot(dx, dy) || 1;

        if (dist < bh.maxRadius * 1.2) {
          const force = (bh.pullStrength / (dist + 30)) * dt * 60;
          mouse.x += (dx / dist) * force;
          mouse.y += (dy / dist) * force;
        }

        if (dist < bh.radius + mouse.radius) {
          spawnParticles(mouse.x, mouse.y, '#9a47ff', 25, 2.5, 220);
          endGame('Você foi engolido pelo Buraco Negro');
          return;
        }

        if (bh.life <= 0) blackHoles.splice(i, 1);
      }
    }

    function updateSlowZones(dt) {
      for (let i = slowZones.length - 1; i >= 0; i--) {
        slowZones[i].life -= dt;
        if (slowZones[i].life <= 0) slowZones.splice(i, 1);
      }
    }

    // AIMBOT JUSTO: A mira trava antes de disparar e tem tolerância de desvio humana
    function updateKamehamehas(dt) {
      for (let i = kamehamehas.length - 1; i >= 0; i--) {
        const kh = kamehamehas[i];
        
        if (kh.warningTimer > 0) {
          kh.warningTimer -= dt;
          // Trava a mira suavemente com um leve atraso (simulando tempo de reação humano)
          const targetAngle = Math.atan2(mouse.y - bot.y, mouse.x - bot.x);
          kh.angle += (targetAngle - kh.angle) * (dt * 4); 
          continue;
        }

        kh.activeTimer -= dt;

        const toMouseX = mouse.x - bot.x;
        const toMouseY = mouse.y - bot.y;
        const mouseDist = Math.hypot(toMouseX, toMouseY);
        const mouseAngle = Math.atan2(toMouseY, toMouseX);
        
        let angleDiff = Math.abs(mouseAngle - kh.angle);
        while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
        angleDiff = Math.abs(angleDiff);

        // Tolerância de ângulo ajustada para dar chance real de esquiva lateral
        if (angleDiff < 0.18 && mouseDist < Math.max(world.width, world.height)) {
          spawnParticles(mouse.x, mouse.y, '#66e3ff', 25, 2.5, 250);
          endGame('Você foi atingido pelo Kamehameha');
          return;
        }

        if (kh.activeTimer <= 0) kamehamehas.splice(i, 1);
      }
    }

    function updateProjectiles(dt) {
      for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        if (p.kind === 'homing') {
          const dx = mouse.x - p.x; const dy = mouse.y - p.y; const distance = Math.hypot(dx, dy) || 1;
          const speed = Math.max(220, Math.hypot(p.vx, p.vy));
          p.vx += ((dx / distance) * speed - p.vx) * p.turnRate * dt;
          p.vy += ((dy / distance) * speed - p.vy) * p.turnRate * dt;
        }
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        if (Math.hypot(mouse.x - p.x, mouse.y - p.y) < p.radius + mouse.radius) { spawnParticles(mouse.x, mouse.y, p.color, 18, 2.2, 220); endGame('Você foi atingido'); return; }
        if (p.life <= 0 || p.x < -60 || p.x > world.width + 60 || p.y < -60 || p.y > world.height + 60) projectiles.splice(i, 1);
      }
    }

    function updateBossClones(dt) {
      for (let i = bossClones.length - 1; i >= 0; i--) {
        const clone = bossClones[i]; clone.life -= dt; clone.wobble += dt * 7;
        const dx = mouse.x - clone.x; const dy = mouse.y - clone.y; const distance = Math.hypot(dx, dy) || 1;
        const dirX = dx / distance; const dirY = dy / distance;
        clone.x += (dirX - dirY * Math.sin(clone.wobble) * 0.4) * clone.speed * dt;
        clone.y += (dirY + dirX * Math.cos(clone.wobble) * 0.4) * clone.speed * dt;
        if (!clone.shotDone) {
          clone.burstTimer -= dt;
          if (clone.burstTimer <= 0) { spawnHomingProjectile(clone.x, clone.y, mouse.x, mouse.y, 250 + state.time * 2, clone.hue); clone.shotDone = true; }
        }
        if (distance < clone.radius + mouse.radius) { spawnParticles(mouse.x, mouse.y, clone.hue, 22, 2.6, 230); endGame('Você foi cercado'); return; }
        if (clone.life <= 0) bossClones.splice(i, 1);
      }
    }

    function updateEnemies(dt) {
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i]; const target = getEnemyTarget(enemy);
        const dx = target.x - enemy.x; const dy = target.y - enemy.y;
        
        let sepX = 0; let sepY = 0;
        for (let j = 0; j < enemies.length; j++) {
          if (i === j) continue; const other = enemies[j]; const ox = enemy.x - other.x; const oy = enemy.y - other.y; const od = Math.hypot(ox, oy);
          const gap = enemy.radius + other.radius + 35;
          if (od > 0 && od < gap) { const str = (gap - od) / gap; sepX += (ox / od) * str; sepY += (oy / od) * str; }
        }
        
        const distToTarget = Math.hypot(dx, dy) || 1;
        const dirX = dx / distToTarget; const dirY = dy / distToTarget;

        enemy.wobble += dt * 5;
        const orbitStr = enemy.type === 'orbiter' ? 0.54 : enemy.type === 'flanker' ? 0.36 : 0.18;
        
        const distToPlayer = Math.hypot(mouse.x - enemy.x, mouse.y - enemy.y);
        const ringPull = enemy.type === 'orbiter' ? clamp((distToPlayer - enemy.orbitRadius) / enemy.orbitRadius, -1, 1) * 0.22 : 0;
        
        const sX = dirX * (enemy.turnBias + ringPull) + sepX * 4.5 - dirY * Math.sin(enemy.wobble) * orbitStr;
        const sY = dirY * (enemy.turnBias + ringPull) + sepY * 4.5 + dirX * Math.cos(enemy.wobble) * orbitStr;
        const sLen = Math.hypot(sX, sY) || 1; const spdMult = enemy.type === 'hunter' ? 1.18 : enemy.type === 'flanker' ? 1.08 : 1;
        enemy.x += (sX / sLen) * enemy.speed * spdMult * dt; enemy.y += (sY / sLen) * enemy.speed * spdMult * dt;

        if (distToPlayer < enemy.radius + mouse.radius) { spawnParticles(mouse.x, mouse.y, enemy.hue, 22, 2.6, 230); endGame('Você foi cercado'); return; }
        
        enemy.life -= dt;
        if (enemy.life <= 0 || enemy.x < -80 || enemy.x > world.width + 80 || enemy.y < -80 || enemy.y > world.height + 80) {
          spawnParticles(enemy.x, enemy.y, enemy.hue, 8, 1.5, 120); enemies.splice(i, 1);
        }
      }
    }

    function updateParticles(dt) {
      for (let i = particles.length - 1; i >= 0; i--) {
        const particle = particles[i]; particle.life -= dt;
        particle.x += particle.vx * 60 * dt; particle.y += particle.vy * 60 * dt; particle.vy += 18 * dt;
        if (particle.life <= 0) particles.splice(i, 1);
      }
    }

    function drawBackground() {
      ctx.clearRect(0, 0, world.width, world.height);
      const gradient = ctx.createRadialGradient(world.width * 0.5, world.height * 0.45, 30, world.width * 0.5, world.height * 0.5, Math.max(world.width, world.height) * 0.72);
      gradient.addColorStop(0, 'rgba(15, 21, 46, 0.82)'); gradient.addColorStop(1, 'rgba(6, 8, 20, 1)');
      ctx.fillStyle = gradient; ctx.fillRect(0, 0, world.width, world.height);
      ctx.save(); ctx.globalAlpha = 0.7;
      for (const star of world.stars) {
        star.y += star.s * 18 * 0.016; if (star.y > world.height + 4) { star.y = -4; star.x = Math.random() * world.width; }
        ctx.beginPath(); ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2); ctx.fillStyle = `hsla(${star.hue}, 100%, 85%, ${0.34 + star.r * 0.2})`; ctx.fill();
      }
      ctx.restore();
      if (state.shake > 0) ctx.translate(rand(-state.shake * 5, state.shake * 5), rand(-state.shake * 5, state.shake * 5));
    }

    function drawBlackHoles() {
      for (const bh of blackHoles) {
        ctx.save();
        if (bh.warningTimer > 0) {
          ctx.strokeStyle = 'rgba(154, 71, 255, 0.7)';
          ctx.lineWidth = 2;
          ctx.setLineDash([4, 4]);
          ctx.beginPath();
          ctx.arc(bh.x, bh.y, bh.maxRadius * (1 - bh.warningTimer), 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.shadowBlur = 15;
          ctx.shadowColor = '#9a47ff';
          ctx.beginPath();
          ctx.arc(bh.x, bh.y, bh.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(34, 8, 68, 0.6)';
          ctx.fill();
          ctx.strokeStyle = '#9a47ff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawSlowZones() {
      for (const sz of slowZones) {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 181, 71, 0.03)';
        ctx.strokeStyle = 'rgba(255, 181, 71, 0.15)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.rect(sz.x - sz.width/2, sz.y - sz.height/2, sz.width, sz.height);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }

    function drawKamehamehas() {
      for (const kh of kamehamehas) {
        ctx.save();
        const maxDist = Math.max(world.width, world.height) * 1.5;

        if (kh.warningTimer > 0) {
          ctx.strokeStyle = 'rgba(102, 227, 255, 0.8)';
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 6]);
          
          const spreadAngle = 0.18; // Feixe de mira bem focado
          ctx.beginPath();
          ctx.moveTo(bot.x, bot.y);
          ctx.lineTo(bot.x + Math.cos(kh.angle - spreadAngle) * maxDist, bot.y + Math.sin(kh.angle - spreadAngle) * maxDist);
          ctx.moveTo(bot.x, bot.y);
          ctx.lineTo(bot.x + Math.cos(kh.angle + spreadAngle) * maxDist, bot.y + Math.sin(kh.angle + spreadAngle) * maxDist);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(bot.x, bot.y);
          ctx.lineTo(bot.x + Math.cos(kh.angle) * maxDist, bot.y + Math.sin(kh.angle) * maxDist);
          ctx.stroke();
        } else {
          ctx.shadowBlur = 35;
          ctx.shadowColor = '#66e3ff';
          
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 16;
          ctx.beginPath();
          ctx.moveTo(bot.x, bot.y);
          ctx.lineTo(bot.x + Math.cos(kh.angle) * maxDist, bot.y + Math.sin(kh.angle) * maxDist);
          ctx.stroke();

          ctx.strokeStyle = 'rgba(102, 227, 255, 0.6)';
          ctx.lineWidth = 40;
          ctx.beginPath();
          ctx.moveTo(bot.x, bot.y);
          ctx.lineTo(bot.x + Math.cos(kh.angle) * maxDist, bot.y + Math.sin(kh.angle) * maxDist);
          ctx.stroke();
        }
        ctx.restore();
      }
    }

    function drawCursor() {
      if (!mouse.visible) return;
      ctx.save(); ctx.shadowBlur = 24; ctx.shadowColor = 'rgba(102, 227, 255, 0.65)';
      ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 6, 0, Math.PI * 2); ctx.fillStyle = '#66e3ff'; ctx.fill();
      ctx.shadowBlur = 0; ctx.beginPath(); ctx.arc(mouse.x, mouse.y, 14, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(102, 227, 255, 0.22)'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();
    }

    function drawTeleportArrivalIndicator() {
      if (!teleportTarget) return;
      const pulse = clamp(teleportTarget.fadeIn, 0, 1); const mRadius = 24 + Math.sin(pulse * 10) * 3 + pulse * 10; const glow = 0.75 - pulse * 0.35;
      ctx.save(); ctx.translate(teleportTarget.x, teleportTarget.y); ctx.shadowBlur = 26; ctx.shadowColor = 'rgba(102, 227, 255, 0.8)';
      ctx.globalAlpha = glow; ctx.strokeStyle = 'rgba(102, 227, 255, 0.95)'; ctx.lineWidth = 2.5; ctx.setLineDash([8, 7]);
      ctx.beginPath(); ctx.arc(0, 0, mRadius + 8, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = glow * 0.9;
      ctx.beginPath(); ctx.arc(0, 0, mRadius, 0, Math.PI * 2); ctx.stroke();
      for (const angle of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) { const dx = Math.cos(angle); const dy = Math.sin(angle); ctx.beginPath(); ctx.moveTo(dx * (mRadius - 5), dy * (mRadius - 5)); ctx.lineTo(dx * (mRadius + 16), dy * (mRadius + 16)); ctx.stroke(); }
      ctx.globalAlpha = Math.min(1, 0.35 + pulse * 0.45); ctx.fillStyle = '#f0f4ff'; ctx.beginPath(); ctx.arc(0, 0, 4 + pulse * 2, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    function drawBot() {
      ctx.save(); if (teleportTarget) drawTeleportArrivalIndicator();
      ctx.globalAlpha = bot.alpha ?? 1; ctx.shadowBlur = 24; ctx.shadowColor = 'rgba(255, 95, 109, 0.45)';
      ctx.beginPath(); ctx.arc(bot.x, bot.y, bot.radius, 0, Math.PI * 2); ctx.fillStyle = bot.color; ctx.fill();
      const eyeAngle = Math.atan2(mouse.y - bot.y, mouse.x - bot.x);
      ctx.beginPath(); ctx.arc(bot.x + Math.cos(eyeAngle) * 6, bot.y + Math.sin(eyeAngle) * 6, 4.5, 0, Math.PI * 2); ctx.fillStyle = '#08111c'; ctx.fill();
      ctx.beginPath(); ctx.arc(bot.x, bot.y, bot.radius + 5, 0, Math.PI * 2); ctx.strokeStyle = 'rgba(255, 95, 109, 0.18)'; ctx.lineWidth = 3; ctx.stroke();
      ctx.restore();
    }

    function drawProjectiles() {
      for (const p of projectiles) {
        ctx.save(); ctx.shadowBlur = p.kind === 'homing' ? 22 : 18; ctx.shadowColor = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fillStyle = p.color; ctx.fill();
        if (p.kind === 'homing') { ctx.globalAlpha = 0.35; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius + 6, 0, Math.PI * 2); ctx.strokeStyle = p.color; ctx.lineWidth = 1.5; ctx.stroke(); }
        ctx.restore();
      }
    }

    function drawBossClones() {
      for (const clone of bossClones) {
        ctx.save(); ctx.globalAlpha = 0.45 + Math.max(0, clone.life / 2.4) * 0.4; ctx.shadowBlur = 18; ctx.shadowColor = clone.hue;
        ctx.beginPath(); ctx.arc(clone.x, clone.y, clone.radius, 0, Math.PI * 2); ctx.fillStyle = clone.hue; ctx.fill();
        ctx.globalAlpha = 0.22; ctx.beginPath(); ctx.arc(clone.x, clone.y, clone.radius + 6, 0, Math.PI * 2); ctx.strokeStyle = clone.hue; ctx.lineWidth = 2; ctx.stroke();
        ctx.restore();
      }
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.save(); ctx.shadowBlur = 16; ctx.shadowColor = enemy.hue;
        ctx.beginPath(); ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2); ctx.fillStyle = enemy.hue; ctx.fill();
        ctx.restore();
      }
    }

    function drawParticles() {
      for (const particle of particles) {
        const alpha = clamp(particle.life / particle.maxLife, 0, 1);
        ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.arc(particle.x, particle.y, particle.size * alpha, 0, Math.PI * 2); ctx.fillStyle = particle.color; ctx.fill(); ctx.restore();
      }
    }

    function drawVignette() {
      const gradient = ctx.createRadialGradient(world.width / 2, world.height / 2, Math.min(world.width, world.height) * 0.35, world.width / 2, world.height / 2, Math.max(world.width, world.height) * 0.72);
      gradient.addColorStop(0, 'rgba(0,0,0,0)'); gradient.addColorStop(1, 'rgba(0,0,0,0.46)'); ctx.fillStyle = gradient; ctx.fillRect(0, 0, world.width, world.height);
    }

    function drawOverlayFrame() {
      if (!state.flash) return;
      ctx.save(); ctx.fillStyle = 'rgba(255, 95, 109, 0.12)'; ctx.fillRect(0, 0, world.width, world.height); ctx.restore();
    }

    function loop(ts) {
      if (!state.running) return;
      const dt = Math.min(0.033, (ts - state.lastTs) / 1000 || 0.016);
      state.lastTs = ts; state.time = (ts - state.startTs) / 1000;
      timeDisplay.textContent = state.time.toFixed(1);

      spawnTimer += dt; botAttackTimer += dt; titleFlashTimer += dt;
      if (spawnTimer > Math.max(1.2, 2.6 - state.time * 0.06)) { spawnTimer = 0; if (enemies.length < 8) spawnEnemy(); }
      state.shake = (state.time > 12 && state.time % 5 < dt) ? Math.min(1, state.shake + 0.15) : Math.max(0, state.shake - dt * 0.6);

      updateBot(dt); 
      updateBlackHoles(dt);
      updateSlowZones(dt);
      updateKamehamehas(dt);
      updateProjectiles(dt); 
      updateBossClones(dt); 
      updateEnemies(dt); 
      updateParticles(dt);

      ctx.save(); 
      drawBackground(); 
      drawBlackHoles();
      drawSlowZones();
      drawKamehamehas();
      drawParticles(); 
      drawEnemies(); 
      drawBossClones(); 
      drawProjectiles(); 
      drawBot(); 
      drawCursor(); 
      drawVignette(); 
      drawOverlayFrame(); 
      ctx.restore();

      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', resizeCanvas); window.addEventListener('pointermove', pointerToWorld); window.addEventListener('pointerdown', pointerToWorld);
    window.addEventListener('pointerleave', () => { state.pointerInside = false; mouse.visible = true; }); window.addEventListener('pointerenter', () => { state.pointerInside = true; mouse.visible = true; });
    window.addEventListener('blur', () => { if (state.running) showToast('Volte para a janela para continuar fugindo.'); });

    startBtn.addEventListener('click', startGame); demoBtn.addEventListener('click', () => { showToast('Toque/arraste, fique em movimento e tente prever os dashes.'); });

    function generateToken() {
      return Math.random().toString(36).substring(2) + Date.now().toString(36);
    }

    function renderLeaderboard(placarArray) {
      leaderboardList.innerHTML = '';
      if (!Array.isArray(placarArray) || placarArray.length === 0) {
        leaderboardList.innerHTML = '<li style="color: var(--muted);">Nenhum recorde ainda.</li>';
        return;
      }
      
      const meuNome = localStorage.getItem(savedPlayerNameKey) || "";
      const placarFiltrado = placarArray.filter(p => p && p.nome && typeof p.nome === 'string' && p.nome.toLowerCase() !== 'glitchbot');

      if (placarFiltrado.length === 0) {
        leaderboardList.innerHTML = '<li style="color: var(--muted);">Nenhum recorde ainda.</li>';
        return;
      }

      placarFiltrado.slice(0, 5).forEach(p => {
        const li = document.createElement('li');
        const colorTitle = (p.nome === meuNome) ? 'var(--accent)' : 'inherit';
        const fontWeight = (p.nome === meuNome) ? '800' : 'normal';
        
        li.innerHTML = `<strong style="color: ${colorTitle}; font-weight: ${fontWeight};">${p.nome}</strong> <span style="float: right; color: var(--accent); font-weight: 800;">${Number(p.tempo).toFixed(1)}s</span>`;
        li.style.marginBottom = '8px';
        leaderboardList.appendChild(li);
      });
    }

    function renderLeaderboardFromCache() {
      const cache = localStorage.getItem(leaderboardCacheKey);
      if (cache) {
        try {
          renderLeaderboard(JSON.parse(cache));
        } catch(e) {
          leaderboardList.innerHTML = '<li style="color: var(--muted);">Nenhum recorde ainda.</li>';
        }
      } else {
        leaderboardList.innerHTML = '<li style="color: var(--muted);">Nenhum recorde ainda.</li>';
      }
    }

    async function fetchLeaderboard(forceRender = false) {
      if (forceRender) leaderboardList.innerHTML = '<li style="color: var(--muted);">Sincronizando placar...</li>';

      if (!leaderboardApiAvailable) {
        renderLeaderboardFromCache();
        return;
      }
      
      try {
        const res = await fetch(leaderboardEndpoint);
        if (!res.ok) throw new Error('Falha ao carregar o placar');
        const data = await res.json();
        
        const placar = Array.isArray(data.record) ? data.record : Array.isArray(data) ? data : [];
        
        localStorage.setItem(leaderboardCacheKey, JSON.stringify(placar)); 
        if (forceRender || overlay.style.display === 'flex') {
          renderLeaderboard(placar);
        }
      } catch (err) {
        if(forceRender) leaderboardList.innerHTML = '<li style="color: var(--danger);">Erro de conexão. Mostrando versão offline.</li>';
        setTimeout(renderLeaderboardFromCache, 1500);
      }
    }

    async function autoSaveScore(nomeDoJogador, tempoAlcancado) {
      let tokenDoNavegador = localStorage.getItem(playerTokenKey);
      if (!tokenDoNavegador) tokenDoNavegador = generateToken();

      let placarBase = [];
      try {
        const cache = localStorage.getItem(leaderboardCacheKey);
        placarBase = cache ? JSON.parse(cache) : [];
        if (!Array.isArray(placarBase)) placarBase = []; 
      } catch (error) {
        placarBase = [];
      }

      const jogadorExistenteLocal = placarBase.find((p) => p && p.nome === nomeDoJogador);
      if (jogadorExistenteLocal) {
        if (jogadorExistenteLocal.token && jogadorExistenteLocal.token !== tokenDoNavegador) {
          submitMsg.textContent = 'Aviso: Este apelido já tem dono.';
          submitMsg.style.color = 'var(--warning)';
          return;
        }

        if (tempoAlcancado > jogadorExistenteLocal.tempo) {
          jogadorExistenteLocal.tempo = tempoAlcancado;
        }
      } else {
        placarBase.push({ nome: nomeDoJogador, tempo: tempoAlcancado, token: tokenDoNavegador });
      }

      placarBase.sort((a, b) => Number(b.tempo || 0) - Number(a.tempo || 0));
      placarBase = placarBase.slice(0, 10);

      if (!leaderboardApiAvailable) {
        syncedTime = tempoAlcancado;
        localStorage.setItem(syncedScoreKey, String(syncedTime));
        localStorage.setItem(playerTokenKey, tokenDoNavegador);
        localStorage.setItem(leaderboardCacheKey, JSON.stringify(placarBase));

        submitMsg.textContent = 'Novo recorde!';
        submitMsg.style.color = 'var(--good)';
        renderLeaderboard(placarBase);
        return;
      }

      try {
        const res = await fetch(leaderboardEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: nomeDoJogador,
            tempo: tempoAlcancado,
            token: tokenDoNavegador,
            record: placarBase
          })
        });

        const payload = await res.json();
        if (!res.ok) {
          throw new Error(payload.error || 'Erro ao salvar o placar.');
        }

        const placar = Array.isArray(payload.record) ? payload.record : placarBase;
        const tempoSincronizado = typeof payload.syncedTime === 'number' ? payload.syncedTime : tempoAlcancado;
        const foiAtualizado = payload.updated !== false;

        syncedTime = tempoSincronizado;
        localStorage.setItem(syncedScoreKey, String(syncedTime));
        localStorage.setItem(playerTokenKey, tokenDoNavegador);
        localStorage.setItem(leaderboardCacheKey, JSON.stringify(placar));

        submitMsg.textContent = foiAtualizado ? 'Novo recorde!' : '';
        submitMsg.style.color = foiAtualizado ? 'var(--good)' : 'var(--muted)';

        renderLeaderboard(placar);
        return;

      } catch (err) {
        syncedTime = tempoAlcancado;
        localStorage.setItem(syncedScoreKey, String(syncedTime));
        localStorage.setItem(playerTokenKey, tokenDoNavegador);
        localStorage.setItem(leaderboardCacheKey, JSON.stringify(placarBase));
        submitMsg.textContent = 'Novo recorde salvo localmente.';
        submitMsg.style.color = 'var(--good)';
        renderLeaderboard(placarBase);
      }
    }

    registerNameBtn.addEventListener('click', () => {
      const novoNome = playerNameInput.value.trim();
      if (!novoNome) {
        submitMsg.textContent = "Por favor, digite um apelido válido.";
        submitMsg.style.color = "var(--warning)";
        return;
      }

      localStorage.setItem(savedPlayerNameKey, novoNome);
      submitMsg.textContent = "";
      checkPlayerAuth();

      if (state.time > 0 && state.time > syncedTime) {
         autoSaveScore(novoNome, state.time);
      }
    });

    checkPlayerAuth();
    fetchLeaderboard(false); 
    resizeCanvas();
    drawOverlayFrame();
  </script>
</body>
</html>
